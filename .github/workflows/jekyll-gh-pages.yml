# Build the Jekyll site together with the paper PDF and deploy to GitHub Pages
name: Deploy Jekyll site and paper PDF to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Render Graphviz figures
        run: |
          if ! command -v dot >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes graphviz
          fi
          dot -Tpng:cairo -Gdpi=180 \
            -o paper/figures/qbi-index-structure.png \
            paper/figures/qbi-index-structure.dot
      - name: Generate preprint LaTeX
        uses: xuanxu/publishing-artifacts-action@main
        with:
          journal: joss
          paper-path: paper/paper.md
          args: "-o preprint"
      - name: Build preprint PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.preprint.tex
          working_directory: paper
          os: debian
      - name: Rename PDF
        run: mv paper/paper.preprint.pdf paper/paper.pdf
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
