name: Build Paper PDF

on:
  push:
    paths:
      - ".github/workflows/paper-pdf.yml"
      - "paper/**"
  pull_request:
    paths:
      - ".github/workflows/paper-pdf.yml"
      - "paper/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build JOSS PDF
        uses: xuanxu/publishing-artifacts-action@main
        with:
          journal: joss
          paper-path: paper/paper.md
          args: "-o pdf -p"

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: qbix-paper-pdf
          path: paper/paper.pdf
