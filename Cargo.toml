[package]
name = "qbix"
version = "0.1.2"
edition = "2021"
rust-version = "1.87"
build = "build.rs"
license = "MIT"
description = "Random access to BAM records by read name using a compact .qbi index"
repository = "https://github.com/kojix2/qbix"
keywords = ["bioinformatics", "bam", "htslib", "sam", "genomics"]
categories = ["command-line-utilities", "science"]
include = [
    "/src/**",
    "/tests/**",
    "/include/**",
    "/docs/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
biosyntax = []

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage"] }
memmap2 = "0.9.11"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
