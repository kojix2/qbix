name: Build Paper PDF

on:
  push:
    paths:
      - ".github/workflows/paper-pdf.yml"
      - "paper/**"
  pull_request:
    paths:
      - ".github/workflows/paper-pdf.yml"
      - "paper/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate preprint LaTeX
        uses: xuanxu/publishing-artifacts-action@main
        with:
          journal: joss
          paper-path: paper/paper.md
          args: "-o preprint"

      - name: Build preprint PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper.preprint.tex
          working_directory: paper
          os: debian

      - name: Rename PDF
        run: mv paper/paper.preprint.pdf paper/paper.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: qbix-paper-pdf
          path: paper/paper.pdf
